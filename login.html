<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IChan conecta ESG - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header>
        <a href="index.html" class="logo">IChan <span>conecta ESG - DF</span></a>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="login.html">Entrar</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO: Caixa centralizada de login e senha -->
    <main class="container">
        <div class="form-box">
            <h2 style="text-align: center; color: #047857; margin-bottom: 1.2rem;">Acessar Plataforma</h2>
            
            <!-- Formulário HTML puro que redireciona para a home ao enviar -->
            <form action="index.html" method="GET">
                
                <!-- Campo de E-mail -->
                <div class="form-group">
                    <label for="email">E-mail de Acesso:</label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                </div>

                <!-- Campo de Senha -->
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" placeholder="********" required>
                </div>

                <!-- Botão de Submissão -->
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <!-- Links para páginas de cadastro caso o usuário não tenha conta -->
            <div class="links-auxiliares">
                <p>Ainda não tem conta? <br>
                   <a href="cadastro-usuario.html">Cadastrar como Cidadão</a> | 
                   <a href="cadastro-empresa.html">Cadastrar Empresa</a>
                </p>
            </div>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>IChan conecta ESG &copy; 2026 - Distrito Federal</p>
    </footer>

</body>
</html>
